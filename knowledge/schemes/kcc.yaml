id: kcc
name: Kisan Credit Card (KCC)
level: central
benefit: "Short-term farm credit with an interest subvention: loans up to Rs 3 lakh get 2% subvention to the bank plus 3% for prompt repayment."
estimated_value_rs: null
value_basis: "A loan facility, not a payment. The Budget 2025-26 announced raising the limit to Rs 5 lakh; whether that is in force was not confirmed."
apply_url: "https://www.myscheme.gov.in/"
url_verified: false   # the portal home; apply at a bank branch
deadline: null
eligibility:
  land_required: true
requires_documents: [aadhaar, bank_passbook, land_record]
requires_facts: []
notes: "Owner cultivators, tenant farmers, oral lessees and sharecroppers can apply, so a farmer without a land record may still qualify through a lease. Confirm the current limit and rates with the bank."
